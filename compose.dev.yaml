name: theme1-dev
services:
  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theme1_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: theme1_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./theme1
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      MIX_ENV: dev
      DATABASE_URL: ecto://postgres:postgres@db:5432/theme1_dev
      PGHOST: db
      # Local JWT signing is isolated to the development stack.
      AUTH_JWT_SECRET: dev-auth-secret-change-me
      SECRET_KEY_BASE: dev-only-secret-key-base-not-for-production-0123456789-0123456789
      PUBLIC_APP_URL: http://localhost:5173
      MAILER_FROM: no-reply@timemanager.local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:4000"
    volumes:
      - ./theme1:/app
      - theme1_deps:/app/deps
      - theme1_build:/app/_build
  frontend:
    image: node:22.18.0-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:4000
      API_PROXY_TARGET: http://backend:4000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./theme2:/app
      - theme2_node_modules:/app/node_modules
volumes:
  db_dev_data:
  theme1_deps:
  theme1_build:
  theme2_node_modules:
