services:
  frontend:
    image: maurelk/time-manager-frontend:latest
    depends_on:
      - backend
    ports:
      - "8080:80"
  backend:
    image: maurelk/time-manager-backend:latest
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      # Production JWT signing remains outside the image and comes from the VM environment.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      # Password-reset delivery is also supplied only by the VM environment.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      MAILER_FROM: ${MAILER_FROM}
      SMTP_RELAY: ${SMTP_RELAY}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SSL: ${SMTP_SSL:-true}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: 145.241.169.233
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
